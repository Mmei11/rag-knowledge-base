spring:
  application:
    name: ragkb

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rag_kb}
    username: ${DB_USERNAME:rag_user}
    password: ${DB_PASSWORD:rag_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: 3s

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:10MB}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-me}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  document:
    storage-dir: ${DOCUMENT_STORAGE_DIR:storage/documents}
    max-size-bytes: ${DOCUMENT_MAX_SIZE_BYTES:10485760}
    allowed-extensions:
      - pdf
      - txt
      - md
      - markdown
      - docx
      - xlsx
    allowed-content-types:
      - application/pdf
      - text/plain
      - text/markdown
      - text/x-markdown
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - application/octet-stream
  embedding:
    provider: ${EMBEDDING_PROVIDER:mock}
    dimension: ${EMBEDDING_DIMENSION:1024}
  retrieval:
    similarity-threshold: ${RETRIEVAL_SIMILARITY_THRESHOLD:0.35}
    candidate-multiplier: ${RETRIEVAL_CANDIDATE_MULTIPLIER:3}
  chat-model:
    provider: ${CHAT_MODEL_PROVIDER:mock}
    model: ${CHAT_MODEL_NAME:mock-chat-model}
    temperature: ${CHAT_MODEL_TEMPERATURE:0.2}
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    chat-model: ${OPENAI_CHAT_MODEL:gpt-5-mini}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
  qwen:
    api-key: ${QWEN_API_KEY:}
    base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    chat-model: ${QWEN_CHAT_MODEL:qwen-plus}
    embedding-model: ${QWEN_EMBEDDING_MODEL:qwen3.7-text-embedding-flash}
    embedding-batch-size: ${QWEN_EMBEDDING_BATCH_SIZE:20}
    embedding-concurrency: ${QWEN_EMBEDDING_CONCURRENCY:3}
  rate-limit:
    chat:
      enabled: ${CHAT_RATE_LIMIT_ENABLED:true}
      limit: ${CHAT_RATE_LIMIT_LIMIT:20}
      window-seconds: ${CHAT_RATE_LIMIT_WINDOW_SECONDS:60}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
