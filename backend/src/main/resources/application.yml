spring:
  application:
    name: ragkb

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rag_kb}
    username: ${DB_USERNAME:rag_user}
    password: ${DB_PASSWORD:rag_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: 3s

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:10MB}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-me}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  document:
    storage-dir: ${DOCUMENT_STORAGE_DIR:storage/documents}
    max-size-bytes: ${DOCUMENT_MAX_SIZE_BYTES:10485760}
    allowed-extensions:
      - pdf
      - txt
      - md
      - markdown
    allowed-content-types:
      - application/pdf
      - text/plain
      - text/markdown
      - text/x-markdown
      - application/octet-stream
  embedding:
    provider: ${EMBEDDING_PROVIDER:mock}
    dimension: ${EMBEDDING_DIMENSION:384}
  chat-model:
    provider: ${CHAT_MODEL_PROVIDER:mock}
    model: ${CHAT_MODEL_NAME:mock-chat-model}
    temperature: ${CHAT_MODEL_TEMPERATURE:0.2}
  rate-limit:
    chat:
      enabled: ${CHAT_RATE_LIMIT_ENABLED:true}
      limit: ${CHAT_RATE_LIMIT_LIMIT:20}
      window-seconds: ${CHAT_RATE_LIMIT_WINDOW_SECONDS:60}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
